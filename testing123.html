<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Chat Interface</title>
    <style>
        :root {
            --bg-color: #131314;
            --container-bg: #1e1e20;
            --text-color: #e3e3e3;
            --border-color: #444746;
            --user-msg-bg: #2b2a33;
            --ai-msg-bg: #1e1e20;
            --accent-color: #f55036;
            --accent-hover: #d44027;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--container-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .config-group label {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 600;
        }

        .config-group input, .config-group textarea, .config-group select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .config-group textarea {
            resize: none;
            height: 150px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-color);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--container-bg);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.user {
            background-color: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: var(--ai-msg-bg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .message.system-error {
            background-color: #4a151b;
            color: #ffb4ab;
            align-self: center;
            text-align: center;
            border: 1px solid #93000a;
            max-width: 90%;
        }

        .chat-input-area {
            padding: 20px;
            background-color: var(--bg-color);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 16px;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            padding: 8px 0;
            resize: none;
            height: 24px;
            max-height: 100px;
        }

        #send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background-color: var(--accent-hover);
        }

        #send-btn:disabled {
            background-color: var(--border-color);
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Configuration</h2>
        
        <div class="config-group">
            <label for="api-key">Groq API Key</label>
            <input type="password" id="api-key" value="gsk_YOUR_HARDCODED_KEY_HERE" placeholder="gsk_...">
        </div>

        <div class="config-group">
            <label for="model-select">Model</label>
            <select id="model-select">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Versatile)</option>
                <option value="llama-3.1-8b-instant">Llama 3.1 8B (Instant)</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
            </select>
        </div>

        <div class="config-group">
            <label for="system-prompt">System Prompt</label>
            <textarea id="system-prompt">You are a helpful, witty, and concise AI assistant powered by Groq architecture.</textarea>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h3>Groq Chat Interface</h3>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message ai">Hello! I am ready. How can I help you today?</div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let conversationHistory = [];

        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight - 16) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = document.getElementById('api-key').value.trim();
            const systemPrompt = document.getElementById('system-prompt').value.trim();
            const selectedModel = document.getElementById('model-select').value;
            const chatMessagesContainer = document.getElementById('chat-messages');
            const sendBtn = document.getElementById('send-btn');

            if (!text) return;
            
            if (!apiKey || apiKey === 'gsk_YOUR_HARDCODED_KEY_HERE') {
                appendMessage('System Error: Please replace the placeholder with a valid Groq API key in the source code.', 'system-error');
                return;
            }

            appendMessage(text, 'user');
            
            userInput.value = '';
            userInput.style.height = '24px';

            sendBtn.disabled = true;

            const messagesPayload = [
                { role: 'system', content: systemPrompt },
                ...conversationHistory,
                { role: 'user', content: text }
            ];

            try {
                const response = await fetch('https://groq.com', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messagesPayload,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices.message.content;

                conversationHistory.push({ role: 'user', content: text });
                conversationHistory.push({ role: 'assistant', content: aiResponse });

                appendMessage(aiResponse, 'ai');

            } catch (error) {
                console.error(error);
                appendMessage(`Error: ${error.message}`, 'system-error');
            } finally {
                sendBtn.disabled = false;
                chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
